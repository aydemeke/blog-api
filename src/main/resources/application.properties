# ─────────────────────────────────────────────
#  Application
# ─────────────────────────────────────────────
spring.application.name=blog-api

# ─────────────────────────────────────────────
#  H2 In-Memory Database
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─────────────────────────────────────────────
#  JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: schema is created on startup and dropped on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────
#  H2 Web Console  →  http://localhost:8080/h2-console
#  JDBC URL : jdbc:h2:mem:blogdb
#  User     : sa
#  Password : (leave blank)
# ─────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─────────────────────────────────────────────
#  JWT
# ─────────────────────────────────────────────
# Base64-encoded secret key (32+ bytes)
app.jwt.secret=bG9uZ2VyLXNlY3JldC1rZXktZm9yLWJsb2ctYXBpLTIwMjUtdGhhdC1pcy1sb25nLWVub3VnaA==
app.jwt.expiration=86400000
